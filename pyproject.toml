[build-system]
requires = ["setuptools>=77"]  # the SPDX license field needs 77
build-backend = "setuptools.build_meta"

[project]
name = "token-tv"
version = "0.4.1"
description = "Your AI usage limits on a $5 desk clock: Claude, Codex, Grok, Copilot and Antigravity on a 240x240 Wi-Fi clock"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["Pillow>=13,<14"]

[project.urls]
Homepage = "https://github.com/click6067-ship-it/token-tv"
Demo = "https://token-tv.vercel.app"

[project.scripts]
token-tv = "token_tv.cli:entry"

[tool.setuptools]
packages = ["token_tv", "token_tv.providers", "token_tv.web", "token_tv.assets"]

[tool.setuptools.package-data]
"token_tv.web" = ["*"]
"token_tv.assets" = ["*.png", "*.json", "*.bin"]
